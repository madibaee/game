# Publishes the grey-box prototype (prototype/) to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'config/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the prototype's copy of the shared numbers is current
        run: node config/sync.js --check
      - name: Smoke-test the rules engine with all-bot matches
        run: node prototype/test/sim.js 20
      - name: Collect the site
        run: |
          mkdir _site
          cp prototype/index.html prototype/style.css prototype/*.js _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
